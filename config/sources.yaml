# Agent-declared source kinds -> tier, used only when the domain is not in the registry.
source_kind_tiers:
  government: primary_official
  regulator: regulator
  infrastructure_agency: primary_official
  developer: developer
  news: unknown            # unknown news sites are not assumed reputable
  research_report: research_house
  property_portal: property_portal
  broker: broker_marketing
  social_media: social_media
  other: unknown

# Deterministic RSS collection (no login, no scraping behind auth).
rss_feeds:
  - {id: thehindu_bengaluru, url: "https://www.thehindu.com/news/cities/bangalore/feeder/default.rss"}
  - {id: toi_bengaluru, url: "https://timesofindia.indiatimes.com/rssfeeds/-2128833038.cms"}
  - {id: etrealty_top, url: "https://realty.economictimes.indiatimes.com/rss/topstories"}
  - {id: ht_realestate, url: "https://www.hindustantimes.com/feeds/rss/real-estate/rssfeed.xml"}
  - {id: businessline_economy, url: "https://www.thehindubusinessline.com/economy/feeder/default.rss"}
  - {id: mint_money, url: "https://www.livemint.com/rss/money"}

google_news:
  base: "https://news.google.com/rss/search?q={q}+when:3d&hl=en-IN&gl=IN&ceid=IN:en"
  queries:
    # East (priority)
    - Whitefield Bengaluru property
    - Sarjapur Road Bengaluru
    - Varthur Bengaluru
    - Gunjur Bengaluru
    - Panathur Bengaluru
    - Budigere Bengaluru
    - Hoskote real estate
    - KR Puram Bengaluru metro
    - Old Madras Road Bengaluru
    - Marathahalli Bellandur Outer Ring Road
    # Infrastructure & government
    - Namma Metro BMRCL
    - Bengaluru suburban rail K-RIDE
    - Peripheral Ring Road Bengaluru Business Corridor
    - Satellite Town Ring Road Bengaluru
    - BWSSB Cauvery water Bengaluru
    - Greater Bengaluru Authority
    - Karnataka RERA
    - BDA Bengaluru layout
    - Bengaluru tunnel road
    - Bengaluru second airport
    - KIADB Bengaluru
    - Bengaluru master plan zoning
    # Market
    - Bengaluru housing sales
    - Bengaluru residential launch
    - Bengaluru plotted development
    - Bengaluru villa project launch
    - Bengaluru property prices
    - Bengaluru rental housing
    # North / South / West
    - Devanahalli real estate
    - Hebbal Yelahanka property
    - Hennur Thanisandra
    - Electronic City Bengaluru property
    - Kanakapura Road Bengaluru
    - Bannerghatta Road Bengaluru
    - Mysore Road Bengaluru property
    - Tumkur Road Nelamangala

# Sources the system does not access automatically, and why. Reported every run.
known_unavailable:
  - {source: X (Twitter), reason: Login required for search/timelines; only items surfaced by web search are used.}
  - {source: Instagram, reason: Login required; not accessed.}
  - {source: LinkedIn, reason: Login wall for most posts; only publicly indexed posts surfaced by web search.}
  - {source: Kaveri/IGRS registered transaction data, reason: Per-document search requires captcha/login; no bulk registered-price feed is used.}
  - {source: Karnataka RERA project search, reason: Interactive form + captcha; RERA numbers are recorded as "Not verified" unless an agent confirms on a publicly reachable page.}
  - {source: Moneycontrol RSS, reason: HTTP 403 to automated requests (checked 2026-10-15).}
  - {source: 99acres feeds/listings, reason: HTTP 403 to automated requests (checked 2026-10-15).}
  - {source: Housing.com news feed, reason: HTTP 406 to automated requests (checked 2026-10-15).}
