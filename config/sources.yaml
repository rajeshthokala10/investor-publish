# Source registry.
#
# tier         -> evidence weight / interested-party status (see content_engineering/evidence_rules.md)
# group        -> independence group. Sources in the same group are NOT independent
#                 confirmation of each other (shared newsroom, owner or press release).
# Domains match on suffix: "karnataka.gov.in" matches "rera.karnataka.gov.in".
#
# Access notes reflect checks made during implementation; the collector re-tests
# feeds every run and logs failures to logs/source_failures.jsonl.

tiers:
  primary_official:   {weight: 1.0, interested_party: false, label: Government / statutory body}
  regulator:          {weight: 1.0, interested_party: false, label: Regulator}
  operator:           {weight: 0.8, interested_party: true,  label: Infrastructure operator (official but interested)}
  reputable_media:    {weight: 0.7, interested_party: false, label: Reputable news media}
  research_house:     {weight: 0.6, interested_party: true,  label: Property consultancy research (has brokerage business)}
  property_portal:    {weight: 0.3, interested_party: true,  label: Property portal (listing/advertising business)}
  developer:          {weight: 0.3, interested_party: true,  label: Developer / project marketer}
  broker_marketing:   {weight: 0.1, interested_party: true,  label: Broker or paid promotion}
  social_media:       {weight: 0.1, interested_party: true,  label: Social media / influencer}
  aggregator:         {weight: 0.2, interested_party: false, label: Aggregator (resolve to original publisher)}
  unknown:            {weight: 0.2, interested_party: false, label: Unclassified source}

domains:
