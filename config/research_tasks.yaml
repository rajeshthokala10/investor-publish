# Research tasks executed by the headless research agent (prompts/research_agent.md).
# cadence: daily  -> every run, restricted to the 72-hour window
#          baseline -> only when data/processed/market_baseline.json is older than
#                      agent.baseline_refresh_days (historical evidence, any date)
# lead_regions: which RSS leads (by detected region) are handed to the task.

tasks:
  - id: east_launches_prices
    cadence: daily
    lead_regions: [east]
    focus: |
      East Bengaluru residential market: Whitefield, ORR East (Marathahalli/Bellandur),
      Sarjapur Road, Varthur-Gunjur, Panathur-Balagere, Budigere Cross, KR Puram-Hoskote.
      Find EVERY project launch and new phase in the window - villa projects, plotted
      developments (villa plots) and high-rise apartments - with developer, project name, locality,
      type, size (units/plots/acres) and quoted price with basis; search developer press releases,
      "launch" + locality, "villa" + locality, "plotted" + locality, and RERA registrations; quoted prices with their basis (land / carpet /
      built-up / super built-up); RERA numbers shown on developer or official pages;
      possession timelines; rental and resale signals.
      Check developer websites and official announcements for launches you find in news.

  - id: east_catalysts_risks
    cadence: daily
    lead_regions: [east, peripheral]
    focus: |
      East Bengaluru catalysts and risks: metro (Purple Line, Blue Line ORR/airport,
      Sarjapur-Hebbal proposal), suburban rail, STRR, Peripheral Ring Road / Bengaluru
      Business Corridor, Old Madras Road, Hoskote, office leasing and job creation in
      Whitefield/ORR, Cauvery water supply, lake flooding (Varthur, Bellandur), traffic,
      civic works, execution delays and oversupply.

  - id: north_south_west
    cadence: daily
    lead_regions: [north, south, west]
    focus: |
      North (Hebbal, Yelahanka, Hennur, Thanisandra, Devanahalli, airport region),
      South (Electronic City, Hosur Road, Bannerghatta Road, Kanakapura Road) and West
      (Mysore Road, Kengeri, Tumkur Road, Magadi Road) Bengaluru: launches (villas, plotted
      developments and apartments - list every one found with developer and locality), prices,
      infrastructure and risks. Also Devanahalli, Doddaballapur, Hoskote, Kanakapura Road and
      Bidadi villa/plot launches.

  - id: government_watch
    cadence: daily
    lead_regions: [east, north, south, west, peripheral, unmapped]
    focus: |
      City development news first: new roads, flyovers, underpasses, tunnel roads, ring roads,
      water and drainage projects, lake works, layouts and townships, civic decisions.
      Government and infrastructure actions affecting Bengaluru property: BMRCL,
      K-RIDE, NHAI, BDA, BMRDA, Greater Bengaluru Authority and its corporations, BWSSB,
      KIADB, Karnataka cabinet decisions, Karnataka RERA orders, stamp duty / guidance
      value / registration changes, zoning or master-plan changes, court orders.
      For each, identify the stage reached (proposed, announced, approved, funded,
      tendered, awarded, under construction, operational) ONLY from the text of the
      source, and record both publication date and the date of the underlying event.
      Prefer the agency's own website or press release over news coverage.

  - id: metro_watch
    cadence: daily
    lead_regions: [east, north, south, west, peripheral, unmapped]
    focus: |
      Namma Metro and rail news for Bengaluru in the window: BMRCL announcements, line-by-line
      progress (Purple, Green, Yellow, Pink, Blue/airport line, Phase 3, Sarjapur–Hebbal Red
      Line), trial runs, CMRS safety inspections, opening dates, station works, tenders and
      contracts, fares, feeder services, train frequency, rolling stock, ridership records,
      disruptions, and K-RIDE suburban rail corridors. Include what ministers, BMRCL, the
      state government or the Union government said, with dates. Prefer bmrc.co.in,
      kride.in, government press releases and established newspapers.

  - id: social_signals
    cadence: daily
    lead_regions: []
    focus: |
      Public, logged-out-accessible social and video content (YouTube, public LinkedIn
      posts, Reddit r/bangalore discussions) about East Bengaluru property in the last
      72 hours. Treat everything as interested-party or anecdotal. Record what is
      claimed, by whom, and whether any official source supports it. Report which
      platforms you could not access.

  - id: market_baseline
    cadence: baseline
    lead_regions: []
    focus: |
      Historical market evidence for Bengaluru corridors (any publication date within
      the last 3 years, describing periods within the last 6 years): average price per
      sq ft by micro-market with basis and period; price appreciation over stated
      periods; rental yields; unsold inventory, launches and absorption by
      micro-market; plotted-development and villa land-rate trends. Prefer ANAROCK,
      Knight Frank, JLL, CBRE, Colliers, PropEquity, NHB RESIDEX and reputable media
      reporting of them. Always record the period the figure refers to.
